<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Maliha Mohit developer monogram</title>
  <desc id="desc">A dimensional champagne-bronze letter M surrounded by an orbital ring, with code and browser interface panels.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE0BD"/>
      <stop offset=".48" stop-color="#D8B18D"/>
      <stop offset="1" stop-color="#8B6749"/>
    </linearGradient>
    <linearGradient id="goldBright" x1="0" y1="0" x2="1" y2=".8">
      <stop offset="0" stop-color="#FFE2C2"/>
      <stop offset=".52" stop-color="#E6C4A5"/>
      <stop offset="1" stop-color="#B18A68"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62462F"/>
      <stop offset="1" stop-color="#987452"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#624831"/>
      <stop offset="1" stop-color="#38291E"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE0BC"/>
      <stop offset=".55" stop-color="#CBA783"/>
      <stop offset="1" stop-color="#745338"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dy="9"/>
      <feComponentTransfer><feFuncA type="linear" slope=".34"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#050403"/>

  <!-- Orbital circuit -->
  <g fill="none" stroke="url(#orbit)" stroke-width="13" stroke-linecap="round">
    <path d="M211 298 A350 350 0 0 1 696 183"/>
    <path d="M755 231 A350 350 0 0 1 835 345"/>
    <path d="M831 662 A350 350 0 0 1 322 804"/>
    <path d="M269 766 A350 350 0 0 1 191 662"/>
  </g>
  <g fill="#F8D2AD">
    <circle cx="194" cy="326" r="16"/>
    <circle cx="294" cy="785" r="21"/>
  </g>
  <g fill="#745338">
    <circle cx="729" cy="205" r="25"/>
    <circle cx="852" cy="370" r="15"/>
    <circle cx="842" cy="635" r="14"/>
    <circle cx="182" cy="631" r="15"/>
  </g>

  <!-- Circuit connections -->
  <g fill="none" stroke="#D7B28F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 405 V380 Q108 356 132 356 H165 Q191 356 191 331"/>
    <path d="M879 405 V380 Q879 356 855 356"/>
    <path d="M118 570 V594 Q118 618 142 618 H158 Q181 618 181 631"/>
    <path d="M906 590 V610 Q906 635 881 635 H856"/>
  </g>

  <!-- Central dimensional M -->
  <g filter="url(#shadow)">
    <!-- Left upright side -->
    <path d="M280 302 Q280 258 313 270 L399 359 V714 Q399 749 371 755 Q352 759 338 742 L291 690 Q278 675 278 655 Z" fill="url(#side)"/>
    <!-- Left outer face -->
    <path d="M280 302 Q280 258 313 270 Q326 273 340 288 L515 478 Q536 501 559 480 L681 353 Q713 319 738 284 Q753 264 731 270 Q767 271 744 333 L685 412 L552 548 Q528 570 505 547 L331 366 Q280 314 280 302Z" fill="url(#goldBright)"/>
    <!-- Right upright side -->
    <path d="M622 516 L685 451 L685 714 Q685 749 656 755 Q638 758 625 741 Q622 735 622 718 Z" fill="url(#side)"/>
    <!-- Right rising stroke / front face -->
    <path d="M352 390 L482 568 Q500 591 526 575 L701 407 Q724 386 740 409 Q746 418 745 434 L745 500 L591 610 Q566 628 537 624 L485 625 Q463 623 446 603 L352 494 Z" fill="url(#goldBright)"/>
    <!-- Inner shadow facets -->
    <path d="M352 390 L399 439 L399 714 Q399 749 371 755 Q399 738 399 703 L399 487 Q399 463 382 445Z" fill="#6C4D34" opacity=".55"/>
    <path d="M685 451 L745 500 L745 655 Q745 679 729 696 L685 738Z" fill="#5B402C" opacity=".48"/>
    <path d="M352 390 L482 568 Q500 591 526 575 L552 548 L559 480 Q536 501 515 478Z" fill="#B58E6C" opacity=".38"/>
  </g>

  <!-- Left code panel -->
  <g filter="url(#shadow)">
    <rect x="41" y="402" width="202" height="169" rx="32" fill="url(#panel)" stroke="url(#goldBright)" stroke-width="9"/>
    <path d="M105 492 L77 466 L105 438 M177 438 L207 466 L177 492 M160 450 L129 501" fill="none" stroke="#F6D2AE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right browser panel -->
  <g filter="url(#shadow)">
    <rect x="785" y="402" width="198" height="187" rx="31" fill="url(#panel)" stroke="url(#goldBright)" stroke-width="9"/>
    <path d="M790 450 H978" stroke="#B18B69" stroke-width="7"/>
    <g fill="#8A6345">
      <circle cx="819" cy="430" r="9"/>
    </g>
    <g fill="#E8C4A4">
      <circle cx="852" cy="430" r="9"/>
      <circle cx="886" cy="430" r="9"/>
    </g>
    <g stroke="#EBC9A9" stroke-linecap="round" stroke-width="9">
      <path d="M818 480 H947"/>
      <path d="M818 506 H917"/>
      <path d="M818 532 H883"/>
    </g>
    <path d="M818 558 H937" stroke="#A88768" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
